apiVersion: v1
kind: Namespace
metadata:
  name: fuel-friendly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuel-user
  namespace: fuel-friendly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fuel-user
  template:
    metadata:
      labels:
        app: fuel-user
    spec:
      containers:
      - name: fuel-user
        image: wasilahhadi/fuel-user-backend:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fuel-user-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fuel-user-secrets
              key: jwt-secret
        - name: EMAILJS_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: fuel-user-secrets
              key: emailjs-public-key
        - name: EMAILJS_SERVICE_ID
          valueFrom:
            secretKeyRef:
              name: fuel-user-secrets
              key: emailjs-service-id
        - name: EMAILJS_TEMPLATE_ID
          valueFrom:
            secretKeyRef:
              name: fuel-user-secrets
              key: emailjs-template-id
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fuel-user-secrets
              key: stripe-secret-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fuel-user
  namespace: fuel-friendly
spec:
  selector:
    app: fuel-user
  ports:
  - port: 80
    targetPort: 4000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuel-user-ingress
  namespace: fuel-friendly
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/redirect-entry-point: https
spec:
  tls:
  - hosts:
    - apidecor.kelolahrd.life
    secretName: fuel-user-tls
  rules:
  - host: apidecor.kelolahrd.life
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fuel-user
            port:
              number: 80